# ──────────────────────────────────────────────────────────────────────────────
# Pi camera + HomeKit — main configuration
#
# Recommended presets by board (change only the values that differ):
#
#   Pi Zero 2 W  │ bitrate: 4000000 │ snapshot_interval: 5 │ analysis_fps: 5
#   Pi 3 B/B+    │ bitrate: 6000000 │ snapshot_interval: 3 │ analysis_fps: 8
#   Pi 4         │ bitrate: 8000000 │ snapshot_interval: 2 │ analysis_fps: 10
#
# ⚠ Hard limit on ALL Pi models: the hardware H264 encoder tops out at
#   1920×1080 — VideoCore IV (Zero 2 W / Pi 3) AND VideoCore VI (Pi 4) alike.
#   Any width above 1920 crashes VIDIOC_STREAMON (field-tested: OV5647 at
#   2592×1944 on a Zero 2 W, IMX708 at 2304×1296 on a Pi 4). The sensors can
#   capture more; the encoder cannot encode it. Stay at 1920×1080 and let
#   full_fov preserve the lens angle.
#
# Recommended resolution by camera module (all: width 1920, height 1080, fps 30):
#
#   Camera Module v1 (OV5647)
#     full_fov: true  → libcamera selects 1296×972 (full-sensor 2×2 binned),
#                        ISP upscales to 1920×1080 — full lens angle preserved.
#
#   Camera Module v2 (IMX219)
#     full_fov: true  → libcamera selects 1640×1232 (2×2 binned, full FOV),
#                        ISP downscales to 1920×1080.
#
#   Camera Module 3 (IMX708, incl. Wide / NoIR variants)
#     full_fov: true  → libcamera selects 2304×1296 (2×2 binned, full FOV),
#                        ISP downscales to 1920×1080 — the Wide keeps its
#                        full angle.
# ──────────────────────────────────────────────────────────────────────────────

camera:
  width: 1920
  height: 1080
  fps: 30
  bitrate: 8000000        # H264 bit/s — Pi Zero 2W: 4000000 | Pi 3: 6000000 | Pi 4: 8000000
                          # This is the CEILING (used at full quality for HKSV recordings);
                          # live viewers dynamically lower the encoder to what they negotiate
                          # (remote/4G ≈ 2 Mbps) and it returns here when they leave (#47).
  control_port: 8990      # localhost-only endpoint (HomeKit app → camera) driving the
                          # dynamic bitrate — never exposed on the network
  rotation: 0             # 0 | 180 — the Pi ISP cannot rotate 90°/270° (no hardware
                          # transposition; such values are ignored with a warning)
  lores_width: 320        # motion-detection stream width  (Pi Zero 2W: 256)
  lores_height: 240       # motion-detection stream height (Pi Zero 2W: 192)
  snapshot_interval: 2    # seconds between JPEG snapshots — Pi Zero 2W: 5 | Pi 3: 3 | Pi 4: 2
  snapshot_path: /dev/shm/pi4cam-snapshot.jpg   # tmpfs (RAM) — keeps the 24/7 snapshot
                          # rewrites off the SD card to avoid wear. Both the camera and
                          # HomeKit services must agree on this path. Override only if
                          # /dev/shm is unavailable (then point to another tmpfs).
  full_fov: true          # use the full sensor (full lens angle); false = native cropped 1080p
  sharpness: 1.0          # ISP sharpness 0.0–16.0 (1.0 = default; try 1.5–2.0 for crisper edges)
  contrast: 1.0           # ISP contrast  0.0–32.0 (1.0 = default)
  saturation: 1.0         # ISP saturation 0.0–32.0 (1.0 = default; try 1.2–1.5 for richer colours)
  ir_grayscale: false     # [BETA] auto-switch stream + snapshot to grayscale under IR night vision
                          # (kills the 850 nm pink cast). Detection reads the lores chroma planes
                          # (uniform chroma = IR) with hysteresis; the effect neutralises the main
                          # frame's U/V before encoding. The ISP saturation is never touched, so
                          # day/night transitions are detected on real colour data.
  ir_min_fps: 10          # [BETA] night brightness — the REAL lever (needs ir_grayscale). At the
                          # fps above, libcamera caps the night exposure at ~1/fps s and the AEC
                          # only piles on gain; letting the framerate drop to this floor when it's
                          # dark lengthens the exposure instead (10 → up to 3× more light, NO added
                          # noise). Cost: lower night fps (motion blur) + longer keyframe interval.
                          # Lower = brighter/slower; set to >= fps (e.g. 30) to disable.
  ir_exposure: 1.0        # [BETA] secondary fine-tune: ExposureValue bias in EV/stops applied only
                          # at night (+1 = 2× target). Only bites once ir_min_fps has freed shutter
                          # headroom — on its own at 30 fps it saturates with no visible effect.
                          # Useful range 0.0–2.0. 0 = off.
  ir_gamma: 2.2           # [BETA] digital night brightening: tone curve on the image luma while
                          # night mode is active (like raising Exposure in a photo editor, but at
                          # capture time — stream, HKSV and snapshot all benefit). Works even when
                          # the sensor is fully saturated. Black-point anchored: true blacks stay
                          # black (no milky haze), midtones get the light (2.2: luma 64 → ~89,
                          # 128 → ~159). Higher = brighter mids. Range 1.5–3.0; 1.0 = off.

rtsp:
  port: 8554              # mediamtx RTSP port

homekit:
  camera_name: "Pi Camera"   # name shown in the Home app
  motion_port: 8989           # local motion endpoint (Python → Node app)
  motion_timeout: 10          # seconds the MotionSensor stays active per trigger
  qr_web_port: 8080           # local web page showing the pairing QR code
  # The pairing PIN, setup ID and accessory MAC are secrets generated by
  # install.sh into /opt/pi4cam/homekit/pairing.json — never committed to git.

detection:
  enabled: true
  mog2_history: 500
  mog2_var_threshold: 40
  min_motion_area: 1500   # tuned for humans; reduce to ~600 for cats/dogs
  cooldown: 30            # quiet seconds before a movement counts as OVER. Pauses shorter
                          # than this stay inside the same episode: the sensor is held
                          # active through them, so one stop-start wander (a cat…) fires ONE
                          # notification and one uncut HKSV clip. Raise it if you still get
                          # several notifications for what you consider a single event.
  analysis_fps: 10        # MOG2 analysis rate — Pi Zero 2W: 5 | Pi 3: 8 | Pi 4: 10
  mog2_detect_shadows: false  # shadow detection in MOG2 (more CPU, rarely useful)
