camera:
  width: 1920
  height: 1080
  fps: 30
  bitrate: 4000000        # bps — Pi 4 H264 HW encoder
  rotation: 0             # 0 | 90 | 180 | 270
  lores_width: 320
  lores_height: 240

homekit:
  name: "Pi4 Camera"
  pincode: ""             # auto-generated by install.sh if empty
  port: 51826

detection:
  enabled: true
  mog2_history: 500
  mog2_var_threshold: 40
  mog2_detect_shadows: false
  min_motion_area: 1500   # px² — filters small noise blobs
  person_confidence: 0.55
  cooldown: 60            # seconds before re-triggering MotionSensor
  reset_delay: 5          # seconds MotionDetected stays True before auto-clear
