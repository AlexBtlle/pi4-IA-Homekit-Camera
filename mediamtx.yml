# mediamtx — lightweight RTSP relay
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554

# All other protocols disabled — only RTSP is needed (keeps the footprint and
# the listening surface minimal).
rtmp: no
hls: no
webrtc: no
srt: no

paths:
  camera:
    # Stream is published here by our Python service (picamera2 → ffmpeg → RTSP).
    # mediamtx passively relays it to any consumer (the HAP-NodeJS app for live
    # streaming, snapshots and HKSV). No runOnInit — the Pi camera is managed by
    # the pi4cam.service Python process.
