# mediamtx — lightweight RTSP/RTMP/WebRTC server
# Docs: https://github.com/bluenviron/mediamtx

###############################################################################
# Global settings
###############################################################################

# Log level: debug | info | warn | error
logLevel: info
logDestinations: [stdout]

# Protocols to enable
protocols: [tcp]

rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889
srtAddress: :8890

# Authentication — disabled for local use; enable if Pi is on an untrusted network
authMethod: noAuth

###############################################################################
# Camera path
###############################################################################

paths:
  camera:
    # Run rpicam-vid the moment mediamtx starts (not on-demand).
    # MTX_PATH and RTSP_PORT are injected by mediamtx as environment variables.
    # The command publishes its H264 output to mediamtx as an RTSP stream.
    runOnInit: >-
      rpicam-vid
      --codec h264
      --inline
      --nopreview
      --timeout 0
      --width 1920
      --height 1080
      --framerate 30
      -o - |
      ffmpeg
      -hide_banner
      -loglevel warning
      -f h264
      -i pipe:0
      -c:v copy
      -f rtsp
      rtsp://localhost:${RTSP_PORT}/${MTX_PATH}

    # Restart the camera process if it crashes
    runOnInitRestart: yes
