# mediamtx — lightweight RTSP relay
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

rtspTransports: [tcp]
rtspAddress: :8554

# All other protocols disabled — only RTSP is needed
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889
srtAddress: :8890

paths:
  camera:
    # Stream is published here by our Python service (picamera2 → ffmpeg → RTSP).
    # mediamtx passively relays it to any consumer (homebridge-camera-ffmpeg).
    # No runOnInit — the Pi camera is managed by the pi4cam.service Python process.
