name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - run: pytest

  typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: homekit/package-lock.json
      - run: npm ci
        working-directory: homekit
      # Typecheck + compile: vitest transpiles without checking types, so on
      # its own it only exercises the modules the tests import.
      - run: npm run build
        working-directory: homekit
      - run: npm test
        working-directory: homekit
